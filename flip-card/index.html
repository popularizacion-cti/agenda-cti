<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<a href="https://www.peruconciencia.pe/2025/" target="_blank" class="card-link">
    <div class="flip-card">
        <div class="flip-card-inner">

            <!-- Cara frontal -->
            <div class="flip-card-front">
                <div class="overlay">
                    <h3>Perú conCiencia 2025</h3>
                </div>
            </div>

            <!-- Cara posterior -->
            <div class="flip-card-back">
                <div class="overlay">
                    <p>Ingresar al sitio</p>
                </div>
            </div>

        </div>
    </div>
</a>

</body>
</html>
