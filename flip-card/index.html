<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Cards</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="grid-container">

    <!-- FILA 1: 1 rectángulo ancho -->
    <a href="https://www.peruconciencia.pe/2025/" target="_blank" class="card-link card-wide">
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front"><div class="overlay"><h3>Perú conCiencia 2025</h3></div></div>
                <div class="flip-card-back"><div class="overlay"><p>Ingresar</p></div></div>
            </div>
        </div>
    </a>

    <!-- FILA 2: 2 rectángulos heterogéneos -->
    <a href="https://www.peruconciencia.pe/2025/" target="_blank" class="card-link card-medium">
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front"><div class="overlay"><h3>Actividad CTI</h3></div></div>
                <div class="flip-card-back"><div class="overlay"><p>Ver más</p></div></div>
            </div>
        </div>
    </a>

    <a href="https://www.peruconciencia.pe/2025/" target="_blank" class="card-link card-small">
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front"><div class="overlay"><h3>Evento</h3></div></div>
                <div class="flip-card-back"><div class="overlay"><p>Ingresar</p></div></div>
            </div>
        </div>
    </a>

    <!-- FILA 3: 2 rectángulos heterogéneos (distinto orden) -->
    <a href="https://www.peruconciencia.pe/2025/" target="_blank" class="card-link card-small">
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front"><div class="overlay"><h3>Charlas</h3></div></div>
                <div class="flip-card-back"><div class="overlay"><p>Ver</p></div></div>
            </div>
        </div>
    </a>

    <a href="https://www.peruconciencia.pe/2025/" target="_blank" class="card-link card-medium">
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front"><div class="overlay"><h3>Feria</h3></div></div>
                <div class="flip-card-back"><div class="overlay"><p>Explorar</p></div></div>
            </div>
        </div>
    </a>

    <!-- FILA 4: 4 cuadrados iguales -->
    <a href="https://www.peruconciencia.pe/2025/" target="_blank" class="card-link card-square">
        <div class="flip-card"><div class="flip-card-inner">
            <div class="flip-card-front"><div class="overlay"><p>CTI</p></div></div>
            <div class="flip-card-back"><div class="overlay"><p>Ver</p></div></div>
        </div></div>
    </a>

    <a href="https://www.peruconciencia.pe/2025/" target="_blank" class="card-link card-square">
        <div class="flip-card"><div class="flip-card-inner">
            <div class="flip-card-front"><div class="overlay"><p>CTI</p></div></div>
            <div class="flip-card-back"><div class="overlay"><p>Ver</p></div></div>
        </div></div>
    </a>

    <a href="https://www.peruconciencia.pe/2025/" target="_blank" class="card-link card-square">
        <div class="flip-card"><div class="flip-card-inner">
            <div class="flip-card-front"><div class="overlay"><p>CTI</p></div></div>
            <div class="flip-card-back"><div class="overlay"><p>Ver</p></div></div>
        </div></div>
    </a>

    <a href="https://www.peruconciencia.pe/2025/" target="_blank" class="card-link card-square">

            <div class="flip-card-front"><div class="overlay"><p>CTI</p></div></div>
            <div class="flip-card-back"><div class="overlay"><p>Ver</p></div></div>
        </div></div>
    </a>

</div>

</body>
</html>
