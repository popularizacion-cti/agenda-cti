<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda PopCTI - Concytec</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard-wrapper">
    
    <aside class="sidebar">
      <div class="sidebar-content">
        <div class="brand-container">
          <!-- <h1 class="main-sidebar-title">Agenda PopCTI</h1> -->
           <img src="graficas/agendapop.png" alt="Agenda POP CTI" class="sidebar-banner" style="max-width: 100%; height: auto;">
           <img src="graficas/sidebar.jpg" alt="Día de la Diversidad Biológica" class="sidebar-banner" style="max-width: 100%; height: auto;">
        </div>
        <div class="sidebar-actions">
          <div class="sidebar-card">
            <div class="icon-small">📅</div>
            <h3>Descarga la Agenda</h3>
            <p>PDF con efemérides 2026.</p>
            <a href="https://drive.google.com/file/d/1v-zd7xWaECn6gGOY7wn09Hf8XQUnbkcx/view?usp=drive_link" target="_blank" class="btn btn-sidebar">Descargar PDF</a>
          </div>
          <div class="sidebar-card">
            <div class="icon-small">📩</div>
            <h3>Suscríbete</h3>
            <p>Este año se celebrarán cinco efemérides a nivel nacional. Suscríbete para mantenerte informado.</p>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSfDd_ZqwPto_zZkG_mKSqBKLXFdGevqLPhKPw4GMUb5EqszRg/viewform" target="_blank" class="btn btn-sidebar">Suscribirse aquí</a>
          </div>
        </div>
      </div>
    </aside>

    <div class="right-area">
       <header class="top-search-bar">
        <section class="control-panel">
          <h2 class="mini-title">🔎 Filtrar actividades</h2>
          <div id="filtros-cti" class="filtros-inline">
            </div>
          </section>
      </header>

      <main class="results-scroll-area">
        <div class="results-container">
          <h2 id="titulo-semana" class="section-label">📅 Actividades de esta semana</h2>
          <div id="agenda" class="vertical-list">Cargando actividades…</div>
          <div id="resultados-filtro"></div>
        </div>
      </main>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
