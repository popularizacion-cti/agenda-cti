<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda PopCTI - Concytec</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard-wrapper">
    
    <aside class="sidebar">
      <div class="sidebar-content">
        <div class="brand-container">
          <img src="graficas/11feb.png" alt="Banner 11 de Febrero" class="sidebar-banner">
          <h1 class="main-sidebar-title">Agenda PopCTI</h1>
        </div>

        <div class="sidebar-actions">
          <div class="sidebar-card">
            <div class="icon-small">📅</div>
            <h3>Descarga la Agenda</h3>
            <p>PDF con efemérides 2026.</p>
            <a href="https://drive.google.com/file/d/1HAotCjWtFJhaWt1nmYDdunBeOxa_wkyW/view" target="_blank" class="btn btn-sidebar">Descargar PDF</a>
          </div>
          
          <div class="sidebar-card">
            <div class="icon-small">📩</div>
            <h3>Suscríbete</h3>
            <p>Recibe actualizaciones.</p>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSfDd_ZqwPto_zZkG_mKSqBKLXFdGevqLPhKPw4GMUb5EqszRg/viewform" target="_blank" class="btn btn-sidebar">Suscribirse aquí</a>
          </div>
        </div>
      </div>
    </aside>

    <main class="content-area">
      
      <div class="sticky-header-right">
        <section class="control-panel">
          <h2 class="mini-title">🔎 Filtrar actividades</h2>
          <div id="filtros-cti" class="filtros-inline">
            </div>
          <div class="separator-line"></div>
          <h2 class="mini-title">📅 Actividades de esta semana</h2>
        </section>
      </div>

      <section class="results-area">
        <div id="resultados-filtro"></div>
        <div id="agenda" class="vertical-list">Cargando actividades…</div>
      </section>

    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
